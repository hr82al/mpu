[project]
name = "mpu"
version = "0.1.0"
description = "Monorepo Python utilities — multi-purpose CLI for ad-hoc operations"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "astral>=3.2",
    "sqlglot>=25",
    "rich>=13",
    "term-image>=0.7.2",
    "pillow>=10.4.0",
    "telethon>=1.36",
    "python-socks[asyncio]>=2.4",
    "pydantic>=2.9",
]

[project.scripts]
# Единственный бинарь — `mpu`. Подкоманды диспатчатся внутри:
#   mpu <X>            — print + clipboard (бывший `mpu-X`)
#   mpu p <X>          — exec через Portainer (бывший `mpup-X`); `--print` возвращает в print-mode
#   mpu api <X>        — HTTP-клиенты sl-back (бывший `mpuapi-X`)
# Reg'и подкоманд: `mpu.cli_registry` (root + p), `mpu.commands._mpuapi_spec.COMMANDS` (api).
mpu = "mpu.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpu"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    # Верхняя граница: pyright регулярно ужесточает strict между минорами — пин
    # держит тайпчек воспроизводимым (см. version-drift, из-за которого правили типы).
    "pyright>=1.1.380,<1.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "C90",           # mccabe — сложность (порог ниже)
    "PLR0912",       # too-many-branches
    "PLR0915",       # too-many-statements
    "PLR0913",       # too-many-args (порог pylint.max-args ниже)
    "PLR2004",       # magic values
    "ANN401",        # bare Any — единственное, чего pyright strict не ловит
    "RET",           # return-style — ~0 хитов, фиксирует чистоту от регресса
    "PIE",           # misc lints — ~0 хитов
    "PTH",           # pathlib — ~0 хитов
]
ignore = [
    "RUF001",  # Russian comments/strings: cyrillic letters are intentional
    "RUF002",
    "RUF003",
]

# Осознанно НЕ включены: TRY003/EM10x (конфликт с принципом 1 — богатые сообщения
# в raise-сайте), D (docstring-шум, 98% в тестах), ANN кроме ANN401 (дублирует
# pyright strict), FBT (ложится на идиоматичные Typer bool-флаги), ARG (все хиты —
# осознанная единая сигнатура dispatch-таблицы sheet_batch).

[tool.ruff.lint.mccabe]
max-complexity = 12  # дефолт 10 слишком строг для CLI-диспетчеров

[tool.ruff.lint.pylint]
max-args = 8  # дефолт 5 душит Typer-энтрипоинты (каждая опция = параметр)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "ANN401", "C90", "PLR0913"]  # magic-числа, Any, сложные фейки и многоаргументные фабрики в тестах — норма
"src/mpu/commands/_mpuapi_runtime.py" = ["ANN401"]  # динамический CLI-dispatch, Any легален
"src/mpu/lib/sheet_batch.py" = ["ANN401"]           # обход произвольного Sheets-JSON

[tool.ruff.lint.isort]
known-first-party = ["mpu"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

# Coverage не включаем в addopts — замедляет обычный прогон. Мерить явной командой:
#   uv run pytest --cov=mpu --cov-report=term-missing
[tool.coverage.run]
source = ["mpu"]
branch = true                    # branch-coverage важнее line для CLI-ветвлений

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
