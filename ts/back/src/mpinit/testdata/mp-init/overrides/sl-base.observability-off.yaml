# local-stack override (применяется mpu mp-init) — отключает OpenTelemetry для sl-back.
#
# Зачем: .sl-base.env ставит OBSERVABILITY_ENABLED=true и экспорт в mp-otel-collector:4318, а
# коллектора в локальном стеке нет — каждый процесс sl-back сыпал бы ошибками экспорта спанов.
# otel.mjs — guard на OBSERVABILITY_ENABLED==="true", поэтому false делает его no-op.
# `environment:` бьёт `env_file:` → перебиваем флаг, не трогая .sl-base.env / код проекта.
#
# Сервисы из compose.sl-base.yaml (присутствуют и в sl-0, и в sl-1).
services:
  cli:
    environment:
      OBSERVABILITY_ENABLED: "false"
  migrations:
    environment:
      OBSERVABILITY_ENABLED: "false"
  backups:
    environment:
      OBSERVABILITY_ENABLED: "false"
