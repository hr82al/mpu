# local-stack override (применяется mpu mp-init) — отключает OpenTelemetry для sl-instance.
# См. sl-base.observability-off.yaml. Сервисы из compose.sl-instance.yaml (sl-1 / instance).
services:
  i-clients-migrations:
    environment:
      OBSERVABILITY_ENABLED: "false"
  i-internal-api:
    environment:
      OBSERVABILITY_ENABLED: "false"
  # Точка входа src/currencyRatesSync.js удалена из sl-back (98af83ebc): синхронизация курсов с main —
  # жилец currencyRatesSync процесса jobsHost (src/jobs.js, роль из SERVER_TYPE=sl-instance). Ключ —
  # по имени сервиса compose mp-config-local, меняются команда и имя контейнера.
  currency-rates-sync:
    container_name: ${SERVER_NAME}-instance-jobs
    command: "/bin/sh -c 'node --inspect=0.0.0.0 ./src/jobs.js'"
    environment:
      OBSERVABILITY_ENABLED: "false"
  support-jobs:
    environment:
      OBSERVABILITY_ENABLED: "false"
  data-processor:
    environment:
      OBSERVABILITY_ENABLED: "false"
  ss-loader:
    environment:
      OBSERVABILITY_ENABLED: "false"
  ss-updater:
    environment:
      OBSERVABILITY_ENABLED: "false"
  wb-loader:
    environment:
      OBSERVABILITY_ENABLED: "false"
  ozon-loader:
    environment:
      OBSERVABILITY_ENABLED: "false"
  i-wb-unit-calc-worker:
    environment:
      OBSERVABILITY_ENABLED: "false"
